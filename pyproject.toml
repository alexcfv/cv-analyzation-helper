[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "resume-rag-ranker"
version = "1.0.0"
description = "AI-powered resume search using Mistral embeddings, ChromaDB, and LLM profile reranking"
readme = "ReadMe.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "chromadb",
    "requests",
    "openai",
    "pdfplumber",
    "python-telegram-bot",
    "pyyaml",
]

[tool.setuptools.packages.find]
exclude = ["chromadb", "chromadb.*"]
